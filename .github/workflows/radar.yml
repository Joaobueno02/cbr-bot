name: Radar de notícias e parceiros

on:
  schedule:
    - cron: "50 0-2,9-23 * * *"   # de hora em hora, das 6h50 às 23h50 (Brasília), antes das rodadas
    - cron: "20 0-2,9-23 * * *"   # meia hora depois: só manchetes, sem gastar chamadas do Instagram
  workflow_dispatch:

concurrency:
  group: radar-cbr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install feedparser requests pillow
      - name: Radar de manchetes
        run: python bot/radar.py
      # triagem: regras (sem IA) + nota do Gemini (API grátis do AI Studio) e pré-apuração dos 3 melhores.
      # Grava radar/triagem.json, que a rodada do Claude lê primeiro. Sem a chave, fica só a regra;
      # com erro, a rodada usa a pauta.md como antes; o radar não cai.
      - name: Triagem da pauta (regras + Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python bot/triagem.py || echo "triagem falhou; a rodada usa a pauta.md"
      # o feed da BFC e da Luz (radar/parceiros.json) agora é lido a cada 20 min pelo alertas.yml
      - name: Trava anti-vazamento e commit
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "cbr-bot"
          git config user.email "cbr-bot@users.noreply.github.com"
          git add radar
          [ -z "$(git diff --cached --name-only)" ] && { echo "nada mudou"; exit 0; }
          python bot/checar_vazamento.py $(git diff --cached --name-only)
          git commit -m "radar $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
