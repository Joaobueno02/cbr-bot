ns-serif" font-weight="900" font-size="88.5" letter-spacing="-4" fill="#FFFFFF">CBR</text></mask></defs><text x="196" y="90.4" font-family="Unbounded, Archivo, sans-serif" font-weight="900" font-size="88.5" letter-spacing="-4" fill="#56622C">CBR</text><text x="0" y="74" font-family="Archivo, sans-serif" font-weight="600" font-size="46" letter-spacing="1" fill="#101010"><tspan font-family="Unbounded, Archivo, sans-serif" font-weight="900" font-size="49" fill="#56622C">E</tspan>DUCAÇÃO</text><g mask="url(#cbrmask)"><text x="0" y="74" font-family="Archivo, sans-serif" font-weight="600" font-size="46" letter-spacing="1" fill="#FFFFFF"><tspan font-family="Unbounded, Archivo, sans-serif" font-weight="900" font-size="49" fill="#FFFFFF">E</tspan>DUCAÇÃO</text></g></svg></div><div id="bloco" data-limite="760" style="position:absolute;z-index:3;left:120px;right:50px;bottom:442px"><p style="margin:0 0 14px;font-family:Fraunces,Georgia,serif;font-weight:740;font-size:66px;line-height:1;letter-spacing:-1px;text-transform:uppercase;color:#56622C">FINALMENTE</p><p id="titulo" data-max="67" data-min="44" style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:640;font-size:67px;line-height:1.05;letter-spacing:-1px;color:#101010">Quebradeiras de coco, indígenas e quilombolas ganham <span style="font-weight:740;--mk:rgba(86,98,44,0.45);--mk-top:64%;--mk-bot:0%;white-space:nowrap"><span class="mk">237</span> <span class="mk mk-ult">vagas</span></span> em 61 cursos da UFPI</p><p style="margin:26px 0 0;font-family:Archivo,sans-serif;font-size:33px;line-height:1.36;color:#4E4B47">São <b style="color:#101010;font-weight:700">79</b> vagas para cada grupo. Inscrições de <b style="color:#101010;font-weight:700">17 a 26 de novembro</b>, só pela internet.</p></div><div id="barra" style="position:absolute;inset:0;z-index:3;pointer-events:none"><div style="position:absolute;z-index:3;left:120px;width:840px;top:1548px;height:4px;background:#56622C"></div><div style="position:absolute;z-index:3;left:850px;width:110px;top:1548px;height:4px;background:#CBC9C4"></div><p style="position:absolute;z-index:3;left:120px;right:80px;top:1566px;margin:0;font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4E4B47">Foto: Agência Senado · Fontes: Piauí Hoje, Portal O Dia, MPF · 05/11/2026</p></div><img src="file:///home/runner/work/cbr-bot/cbr-bot/assets/papel.jpg" alt="" style="position:absolute;z-index:5;left:0;top:0;width:1080px;height:1920px;mix-blend-mode:multiply;opacity:0.16;pointer-events:none"></div><div aria-hidden="true" style="position:absolute;left:-9999px;top:0;font-size:10px"><span style="font-family:Fraunces;font-weight:640">a</span><span style="font-family:Archivo">a</span><span style="font-family:Unbounded;font-weight:900">a</span></div><script>
async function encaixar(){
  await document.fonts.ready;
  const bloco=document.getElementById('bloco'), tit=document.getElementById('titulo');
  const limite=parseFloat(bloco.dataset.limite), maxT=parseFloat(tit.dataset.max), minT=parseFloat(tit.dataset.min);
  let t=maxT, ok=false;
  for(;t>=minT;t-=2){
    tit.style.fontSize=t+'px';
    // nenhuma linha do título pode estourar a largura
    const largo = tit.scrollWidth <= tit.clientWidth + 1;
    if(bloco.getBoundingClientRect().top>=limite && largo){ok=true;break;}
  }
  const topo=bloco.getBoundingClientRect().top;
  const foto=document.getElementById('foto');
  if(foto){ const minimo=parseFloat(foto.dataset.min); foto.style.height=Math.max(minimo, topo+40)+'px'; }
  const carregadas=new Set(); document.fonts.forEach(f=>{ if(f.status==='loaded') carregadas.add(f.family.replace(/["']/g,'')); });
  const fontes_ok=['Fraunces','Archivo','Unbounded'].every(n=>carregadas.has(n));
  window.__fit={ok:ok && fontes_ok, tamanho:t, topo_bloco:Math.round(topo), fontes_ok:fontes_ok, fontes:[...carregadas]};
}
encaixar();
</script></body></html>
